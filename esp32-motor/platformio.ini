; PlatformIO-konfigurasjon for ESP32-S3 (YD-ESP32-23 / ESP32-S3-N8R2)
; Kode ligger i src/ (f.eks. src/control.cpp)

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

; Serial går til COM-porten (USB-UART), ikke den native USB-porten
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0

; Sett COM-port hvis automatisk deteksjon ikke virker, f.eks. COM5
; upload_port = COM5
; monitor_port = COM5
